<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Mephisto: a study of how autonomous agents learn from real-world environments">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1f"/>
      <stop offset="55%" stop-color="#131a33"/>
      <stop offset="100%" stop-color="#1b1038"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#845EF7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <g opacity="0.1" stroke="#845EF7" stroke-width="1">
    <path d="M80 340h1040M80 260h1040M80 180h1040M80 100h1040"/>
    <path d="M240 60v300M400 60v300M560 60v300M720 60v300M880 60v300M1040 60v300"/>
  </g>

  <!-- the log-sigmoid the study fits -->
  <path d="M80 340C300 338 430 330 540 288C650 246 700 150 820 124C940 98 1040 92 1120 90"
        fill="none" stroke="url(#ramp)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="540" cy="288" r="6" fill="#22d3ee"/>
  <circle cx="820" cy="124" r="6" fill="#845EF7"/>

  <text x="80" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="76" font-weight="700" fill="#e8ecff" letter-spacing="2">Mephisto</text>
  <text x="84" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="22" fill="#9aa6d1">A study of how autonomous agents learn from real-world environments.</text>

  <text x="84" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="20" fill="#22d3ee">S(t) = S_max / (1 + (t_mid / t)^beta)</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#6f7aa8">
    <text x="84" y="372">6 capability families</text>
    <text x="320" y="372">12h+ per task</text>
    <text x="520" y="372">difficulty measured, never claimed</text>
  </g>
</svg>
